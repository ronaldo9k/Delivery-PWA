<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>푸로찜 에스 택배 카드</title>
  <style>
    :root {
      --gold: #d4af37;
      --bg: #111;
      --card: #1d1d1d;
      --line: #333;
      --text: #fff;
      --muted: #aaa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      padding: 16px 12px 32px;
    }
    .wrap { max-width: 620px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; margin: 0; color: var(--gold); }
    .refresh {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .client {
      font-size: 18px;
      font-weight: 800;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }
    .value {
      font-size: 15px;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .copy {
      min-width: 58px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #111;
      padding: 10px 9px;
      font-weight: 800;
      font-size: 13px;
      touch-action: manipulation;
    }
    .copy.done { background: #fff; }
    .empty, .error, .setup {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      line-height: 1.5;
    }
    .setup input {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #111;
      color: #fff;
    }
    .setup button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      font-weight: 800;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚚 푸로찜 에스 택배 카드</h1>
    <button class="refresh" id="refreshBtn">새로고침</button>
  </header>

  <div class="status" id="status">오늘 택배 정보를 불러오는 중...</div>
  <main id="app"></main>
</div>

<script>
  // ================================================================
  // ⭐ 1. 여기에 GAS 웹앱 주소만 넣습니다.
  //    예: https://script.google.com/macros/s/XXXXXXXX/exec
  // ================================================================
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbybzr2KUiIg5bvHFvlQG1bQyzUUDQHdMCZXPJ-WQGJfrcd9Ga63Y1NhaRdzcq1UwyKxWA/exec';

  const TOKEN_STORAGE_KEY = 'prozyme_parcel_pwa_token_v1';
  const app = document.getElementById('app');
  const statusEl = document.getElementById('status');
  const refreshBtn = document.getElementById('refreshBtn');

  let callbackSeq = 0;

  function getToken() {
    const hash = location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const hashToken = params.get('key');

    if (hashToken) {
      localStorage.setItem(TOKEN_STORAGE_KEY, hashToken);
      history.replaceState(null, '', location.pathname + location.search);
      return hashToken;
    }

    return localStorage.getItem(TOKEN_STORAGE_KEY) || '';
  }

  function showSetup() {
    statusEl.textContent = '처음 한 번만 비밀토큰을 입력하세요.';
    app.innerHTML = `
      <div class="setup">
        <b>🔐 PWA 비밀토큰</b>
        <div style="color:#aaa;margin-top:6px;font-size:13px;">
          Apps Script에서 만든 PWA_ACCESS_TOKEN을 넣으세요.
        </div>
        <input id="tokenInput" type="password" autocomplete="off" placeholder="비밀토큰 붙여넣기">
        <button id="saveTokenBtn">저장하고 불러오기</button>
      </div>
    `;

    document.getElementById('saveTokenBtn').addEventListener('click', () => {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('비밀토큰을 입력하세요.');
      localStorage.setItem(TOKEN_STORAGE_KEY, token);
      loadCards();
    });
  }

  function apiUrl(token, callbackName) {
    const sep = GAS_API_URL.indexOf('?') >= 0 ? '&' : '?';
    return GAS_API_URL + sep +
      'action=shippingCards' +
      '&key=' + encodeURIComponent(token) +
      '&callback=' + encodeURIComponent(callbackName) +
      '&_=' + Date.now();
  }

  function loadCards() {
    if (!GAS_API_URL || GAS_API_URL.indexOf('여기에_GAS') >= 0) {
      statusEl.textContent = 'GAS 웹앱 주소가 아직 입력되지 않았습니다.';
      app.innerHTML = '<div class="error">index.html의 <b>GAS_API_URL</b>에 Apps Script 웹앱 주소를 넣어주세요.</div>';
      return;
    }

    const token = getToken();
    if (!token) {
      showSetup();
      return;
    }

    const callbackName = 'prozymePwaCallback_' + (++callbackSeq);
    const script = document.createElement('script');
    let finished = false;

    window[callbackName] = function(data) {
      finished = true;
      delete window[callbackName];
      script.remove();

      if (!data || !data.ok) {
        if (data && data.error === '접근 권한이 없습니다.') {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          showSetup();
          return;
        }
        showError(data && data.error ? data.error : '데이터를 가져오지 못했습니다.');
        return;
      }

      renderCards(data);
    };

    script.onerror = function() {
      if (finished) return;
      delete window[callbackName];
      script.remove();
      showError('GAS 웹앱 호출에 실패했습니다. 웹앱 URL과 배포 상태를 확인하세요.');
    };

    script.src = apiUrl(token, callbackName);
    document.body.appendChild(script);
    statusEl.textContent = '오늘 택배 정보를 불러오는 중...';
  }

  function showError(message) {
    statusEl.textContent = '오류';
    app.innerHTML = '<div class="error">❌ ' + escapeHtml(message) + '</div>';
  }

  function renderCards(data) {
    statusEl.textContent = data.date + ' · 오늘 택배 ' + data.count + '건';

    if (!data.rows || data.rows.length === 0) {
      app.innerHTML = '<div class="empty">📭 오늘 등록된 택배가 없습니다.</div>';
      return;
    }

    app.innerHTML = data.rows.map((r, index) => {
      const cardId = 'card-' + index;
      return `
        <section class="card" id="${cardId}">
          <div class="card-head">
            <div>
              <div class="client">🏢 ${escapeHtml(r.clientName || '-')}</div>
              <div class="meta">${escapeHtml(r.deliveryType || '-')} · ${escapeHtml(r.spec || '-')} / ${escapeHtml(String(r.qty ?? '-'))}개 · 납품요청일 ${escapeHtml(r.requestDate || '-')}</div>
            </div>
          </div>

          ${copyRow('📞', '연락처 1', r.phone, cardId + '-phone')}
          ${copyRow('📍', '검색주소', r.search, cardId + '-search')}
          ${copyRow('🏠', '상세주소', r.detail, cardId + '-detail')}
          ${copyRow('🗺️', '도로명 DB주소', r.road, cardId + '-road')}
          ${copyRow('🧭', '지번주소', r.jibun, cardId + '-jibun')}
        </section>
      `;
    }).join('');

    app.querySelectorAll('.copy').forEach(btn => {
      btn.addEventListener('click', async () => {
        const value = btn.dataset.value || '';
        const original = btn.textContent;

        try {
          await copyText(value);
          btn.textContent = '복사됨 ✓';
          btn.classList.add('done');
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove('done');
          }, 900);
        } catch (e) {
          alert('복사에 실패했습니다. 휴대폰 브라우저의 클립보드 권한을 확인하세요.');
        }
      });
    });
  }

  function copyRow(icon, label, value, id) {
    const safeValue = value || '';
    return `
      <div class="row">
        <div>
          <div class="label">${icon} ${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(safeValue || '-')}</div>
        </div>
        <button class="copy" id="${id}" data-value="${escapeAttr(safeValue)}">복사</button>
      </div>
    `;
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }

    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    const ok = document.execCommand('copy');
    textarea.remove();

    if (!ok) throw new Error('copy failed');
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, '&#096;');
  }

  refreshBtn.addEventListener('click', loadCards);

  // 앱을 열었을 때 최신 정보 확인
  loadCards();

  // 1분마다 자동 새로고침
  setInterval(loadCards, 60 * 1000);

  // PWA 설치 후 최신 index.html 확인
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update();
      }).catch(() => {});
    });
  }
</script>
</body>
</html>

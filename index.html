<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <title>푸로찜 에스 택배등록</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .app { width: 100%; max-width: 600px; margin: 0 auto; padding: 18px 14px 40px; }

    .header { text-align: center; padding: 12px 0 20px; }

    .title { font-size: 24px; font-weight: 800; color: #d4af37; }

    .subtitle { margin-top: 7px; font-size: 13px; color: #aaa; }

    .status {
      margin: 0 0 15px; padding: 12px; border-radius: 12px;
      background: #1d1d1d; text-align: center; font-size: 14px; color: #ccc;
    }

    .card {
      background: #202020; border: 1px solid #383838; border-radius: 16px;
      margin-bottom: 15px; padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }

    .client-name { font-size: 20px; font-weight: 800; color: #fff; }

    .delivery-type {
      font-size: 12px; color: #d4af37;
      border: 1px solid #806b27; border-radius: 20px; padding: 5px 9px;
    }

    .info-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 9px; min-height: 42px;
    }

    .info-label { width: 70px; flex-shrink: 0; color: #aaa; font-size: 13px; }

    .info-value {
      flex: 1; min-width: 0; color: #fff; font-size: 15px;
      line-height: 1.4; word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0; border: 0; border-radius: 9px;
      background: #d4af37; color: #111; font-size: 13px; font-weight: 800;
      padding: 9px 12px; cursor: pointer;
    }

    .copy-btn:active { transform: scale(0.95); }

    .copy-btn.done { background: #4caf50; color: #fff; }

    .meta {
      margin-top: 13px; padding-top: 12px; border-top: 1px solid #383838;
      color: #aaa; font-size: 12px; line-height: 1.7;
    }

    .empty {
      padding: 40px 15px; text-align: center; color: #999;
      background: #1b1b1b; border-radius: 15px;
    }

    .refresh-btn {
      width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: #d4af37; color: #111; font-size: 15px; font-weight: 800;
      cursor: pointer; margin-bottom: 15px;
    }

    .refresh-btn:active { transform: scale(0.98); }

    .token-box {
      background: #1c1c1c; border: 1px solid #333;
      border-radius: 14px; padding: 15px; margin-bottom: 15px;
    }

    .token-title { font-size: 14px; font-weight: 700; margin-bottom: 9px; }

    .token-input {
      width: 100%; height: 44px; border: 1px solid #444; border-radius: 9px;
      background: #111; color: #fff; padding: 0 12px; font-size: 14px; outline: none;
    }

    .token-save {
      width: 100%; height: 44px; margin-top: 9px; border: 0; border-radius: 9px;
      background: #555; color: #fff; font-weight: 700; cursor: pointer;
    }

    .hidden { display: none !important; }

    .loading { padding: 30px; text-align: center; color: #d4af37; }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">푸로찜 에스</div>
    <div class="subtitle">오늘 택배 발송 등록 (당일 + 다음날까지 표시)</div>
  </div>

  <div id="tokenBox" class="token-box hidden">
    <div class="token-title">🔐 PWA 접속 토큰</div>

    <input id="tokenInput" class="token-input" type="password" placeholder="GAS에서 만든 PWA 토큰">

    <button class="token-save" onclick="saveToken()">
      토큰 저장하고 시작
    </button>
  </div>

  <div id="status" class="status">
    불러오는 중...
  </div>

  <button class="refresh-btn" onclick="loadShippingCards()">
    🔄 새로고침
  </button>

  <div id="cards"></div>

</div>


<script>

  // ==========================================================
  // ⭐ GAS 웹앱 주소
  // ==========================================================

  const GAS_API_URL =
    "https://script.google.com/macros/s/AKfycby5aL9w9txAMetUfCqLytyJDW11_uVTIYj2DNNzpwzMacm-WcDYJ5OrHmRNzbxQESgIKQ/exec";


  // ==========================================================
  // ⭐ 토큰 저장
  // ==========================================================

  function getToken() {
    return localStorage.getItem("PROZYME_PWA_TOKEN") || "";
  }


  function saveToken() {

    const input = document.getElementById("tokenInput");
    const token = input.value.trim();

    if (!token) {
      alert("토큰을 입력해주세요.");
      return;
    }

    localStorage.setItem("PROZYME_PWA_TOKEN", token);

    document.getElementById("tokenBox").classList.add("hidden");

    loadShippingCards();
  }


  // ==========================================================
  // ⭐ 페이지 시작
  // ==========================================================

  window.addEventListener("load", function() {

    const token = getToken();

    if (!token) {

      document.getElementById("tokenBox").classList.remove("hidden");

      document.getElementById("status").textContent =
        "처음 한 번만 PWA 토큰을 입력해주세요.";

      return;
    }

    loadShippingCards();

  });


  // ==========================================================
  // ⭐ 한국 날짜 구하기 (폰 시계와 상관없이 한국 시간 기준)
  //    seoulDate(0) = 오늘,  seoulDate(-1) = 어제
  // ==========================================================

  function seoulDate(offsetDays) {

    const d = new Date(Date.now() + (offsetDays || 0) * 86400000);

    return new Intl.DateTimeFormat(
      "en-CA",
      { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }
    ).format(d);   // "yyyy-MM-dd" 모양으로 나옴

  }
    // ==========================================================
  // ⭐ 어떤 모양이든 'yyyy-MM-dd' 로 통일 (PWA 버전)
  // ==========================================================

  function normalizeDatePwa_(value) {

    if (!value) return "";

    let s = String(value).trim();

    if (!s) return "";

    // 이미 yyyy-MM-dd 모양
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      return s.substring(0, 10);
    }

    // '2026. 9. 29.' / '2026/9/29' 모양
    const m = s.match(/(\d{4})[\.\/\-\s]+(\d{1,2})[\.\/\-\s]+(\d{1,2})/);

    if (m) {
      return m[1] + "-" +
             ("0" + m[2]).slice(-2) + "-" +
             ("0" + m[3]).slice(-2);
    }

    return "";

  }



  // ==========================================================
  // ⭐ 오늘/어제 택배 데이터 가져오기
  // ==========================================================

  function loadShippingCards() {

    const token = getToken();

    if (!token) {

      document.getElementById("tokenBox").classList.remove("hidden");

      return;
    }


    document.getElementById("status").textContent =
      "📦 택배 발송 정보를 불러오는 중...";


    document.getElementById("cards").innerHTML =
      '<div class="loading">잠시만 기다려주세요...</div>';


    // ========================================================
    // ⭐ JSONP 방식
    // ========================================================

    const callbackName = "prozymePwaCallback_" + Date.now();


    window[callbackName] = function(result) {

      try {

        renderCards(result);

      } finally {

        delete window[callbackName];

        const script = document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      }

    };


    const script = document.createElement("script");

    script.id = callbackName;

    script.src =
      GAS_API_URL
      + "?action=shippingCards"
      + "&key=" + encodeURIComponent(token)
      + "&callback=" + encodeURIComponent(callbackName)
      + "&t=" + Date.now();   // ⭐ 항상 최신 데이터 (캐시 안 씀)


    script.onerror = function() {

      document.getElementById("status").textContent =
        "❌ GAS 연결에 실패했습니다.";

      document.getElementById("cards").innerHTML =
        '<div class="empty">GAS 웹앱 연결을 확인해주세요.</div>';

      delete window[callbackName];

      script.remove();

    };


    document.body.appendChild(script);

  }


  // ==========================================================
  // ⭐ 카드 화면 만들기
  // ==========================================================

  function renderCards(result) {

    if (!result) {
      showError("응답이 없습니다.");
      return;
    }


    if (result.ok === false) {
      showError(result.message || "데이터를 가져오지 못했습니다.");
      return;
    }


    let rows = [];

    if (Array.isArray(result)) {
      rows = result;
    } else if (Array.isArray(result.cards)) {
      rows = result.cards;
    } else if (Array.isArray(result.rows)) {
      rows = result.rows;
    } else if (Array.isArray(result.data)) {
      rows = result.data;
    }


    // ========================================================
    // ⭐⭐ v3.1 이중 안전장치 :
    //     폰에서도 한 번 더 검사해서
    //     "납품요청일이 어제/오늘/내일" 인 것만 보여준다.
    // ========================================================

    const dYesterday = seoulDate(-1);
    const dToday     = seoulDate(0);
    const dTomorrow  = seoulDate(1);

    rows = rows.filter(function (row) {

      const req = normalizeDatePwa_(row.requestDate);

      // 납품요청일이 없으면 보여주지 않음
      if (!req) {
        return false;
      }

      return (req === dYesterday || req === dToday || req === dTomorrow);

    });



    document.getElementById("status").textContent =
      "📦 납품요청일 기준 택배 " + rows.length + "건 (어제~내일)";



    const container = document.getElementById("cards");

    container.innerHTML = "";


    if (rows.length === 0) {

      container.innerHTML =
        '<div class="empty">'
        + '택배 발송 건이 없습니다.<br><span style="font-size:11px;color:#666">알람은 전송 당일과 다음날까지 표시됩니다.</span>'
        + '</div>';

      return;
    }


    rows.forEach(function(row, index) {

      container.appendChild(
        createCard(row, index)
      );

    });

  }


  // ==========================================================
  // ⭐ 카드 하나 만들기
  // ==========================================================

  function createCard(row, index) {

    const card = document.createElement("div");
    card.className = "card";


    const client = row.clientName || row.client || row.거래처 || "";
    const phone = row.phone || row.연락처 || row["연락처 1"] || "";
    const search = row.search || row.검색주소 || "";
    const detail = row.detail || row.상세주소 || "";
    const road = row.road || row.도로명주소 || "";
    const jibun = row.jibun || row.지번주소 || "";
    const deliveryType = row.deliveryType || row.납품형태 || "택배 발송";
    const spec = row.spec || row.규격 || row["구분(규격)"] || "";
    const qty = row.qty || row.수량 || "";
    const requestDate = row.requestDate || row.납품요청일 || "";
    const sentDate = row.sentDate || "";


    card.innerHTML = `

      <div class="card-header">

        <div class="client-name">
          ${escapeHtml(client)}
        </div>

        <div class="delivery-type">
          ${escapeHtml(deliveryType)}
        </div>

      </div>


      ${makeInfoRow("📞 연락처", phone)}
      ${makeInfoRow("📍 검색주소", search)}
      ${makeInfoRow("🏠 상세주소", detail)}
      ${makeInfoRow("🧭 도로명", road)}
      ${makeInfoRow("📌 지번", jibun)}


      <div class="meta">

        📦 규격 : ${escapeHtml(spec)}
        <br>

        🔢 수량 : ${escapeHtml(qty)}
        <br>

        📅 납품요청일 : ${escapeHtml(requestDate)}
        <br>

        🕐 알람전송일 : ${escapeHtml(sentDate)}

      </div>

    `;


    return card;

  }


  // ==========================================================
  // ⭐ 한 줄 + 복사 버튼 (기존과 동일)
  // ==========================================================

  function makeInfoRow(label, value) {

    if (!value) {
      value = "-";
    }


    const safeValue = escapeHtml(value);


    return `

      <div class="info-row">

        <div class="info-label">
          ${label}
        </div>

        <div class="info-value">
          ${safeValue}
        </div>

        <button
          class="copy-btn"
          onclick="copyText(this, ${JSON.stringify(String(value))})"
        >
          복사
        </button>

      </div>

    `;

  }


  // ==========================================================
  // ⭐ 복사 (기존과 동일)
  // ==========================================================

  async function copyText(button, text) {

    try {

      await navigator.clipboard.writeText(text);

      const original = button.textContent;

      button.textContent = "복사됨 ✓";
      button.classList.add("done");


      setTimeout(function() {

        button.textContent = original;
        button.classList.remove("done");

      }, 1200);


    } catch (error) {

      const textarea = document.createElement("textarea");

      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);

      textarea.focus();
      textarea.select();

      document.execCommand("copy");

      textarea.remove();


      button.textContent = "복사됨 ✓";
      button.classList.add("done");


      setTimeout(function() {

        button.textContent = "복사";
        button.classList.remove("done");

      }, 1200);

    }

  }


  // ==========================================================
  // ⭐ HTML 안전 처리
  // ==========================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==========================================================
  // ⭐ 오류 표시
  // ==========================================================

  function showError(message) {

    document.getElementById("status").textContent = "❌ 오류";

    document.getElementById("cards").innerHTML =
      '<div class="empty">'
      + escapeHtml(message)
      + '</div>';

  }


  // ==========================================================
  // ⭐ 서비스 워커
  // ==========================================================

  if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

      navigator.serviceWorker.register("sw.js")
        .catch(function(error) {

          console.log("Service Worker 등록 실패:", error);

        });

    });

  }

</script>

</body>
</html>

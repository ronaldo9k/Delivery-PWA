<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <title>푸로찜 에스 택배등록</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0;
      background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .app { width: 100%; max-width: 600px; margin: 0 auto; padding: 18px 14px 40px; }

    .header { text-align: center; padding: 12px 0 20px; }

    .title { font-size: 24px; font-weight: 800; color: #d4af37; }

    .subtitle { margin-top: 7px; font-size: 13px; color: #aaa; }

    .status {
      margin: 0 0 15px; padding: 12px; border-radius: 12px;
      background: #1d1d1d; text-align: center; font-size: 14px; color: #ccc;
    }

    .card {
      background: #202020; border: 1px solid #383838; border-radius: 16px;
      margin-bottom: 15px; padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }

    .client-name { font-size: 20px; font-weight: 800; color: #fff; }

    .delivery-type {
      font-size: 12px; color: #d4af37;
      border: 1px solid #806b27; border-radius: 20px; padding: 5px 9px;
    }

    .info-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 9px; min-height: 42px;
    }

    .info-label { width: 70px; flex-shrink: 0; color: #aaa; font-size: 13px; }

    .info-value {
      flex: 1; min-width: 0; color: #fff; font-size: 15px;
      line-height: 1.4; word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0; border: 0; border-radius: 9px;
      background: #d4af37; color: #111; font-size: 13px; font-weight: 800;
      padding: 9px 12px; cursor: pointer;
    }

    .copy-btn:active { transform: scale(0.95); }

    .copy-btn.done { background: #4caf50; color: #fff; }

    /* ⭐ v4.1 : 카드 제목(거래처) 옆 작은 복사 버튼 */
    .copy-btn.mini {
      background: transparent; color: #d4af37;
      border: 1px solid #806b27;
      font-size: 12px; padding: 6px 9px;
    }

    .copy-btn.mini.done { background: #4caf50; color: #fff; border-color: #4caf50; }

    .meta {
      margin-top: 13px; padding-top: 12px; border-top: 1px solid #383838;
      color: #aaa; font-size: 12px; line-height: 1.7;
    }

    .empty {
      padding: 40px 15px; text-align: center; color: #999;
      background: #1b1b1b; border-radius: 15px;
    }

    .refresh-btn {
      width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: #d4af37; color: #111; font-size: 15px; font-weight: 800;
      cursor: pointer; margin-bottom: 15px;
    }

    .refresh-btn:active { transform: scale(0.98); }

    .token-box {
      background: #1c1c1c; border: 1px solid #333;
      border-radius: 14px; padding: 15px; margin-bottom: 15px;
    }

    .token-title { font-size: 14px; font-weight: 700; margin-bottom: 9px; }

    .token-input {
      width: 100%; height: 44px; border: 1px solid #444; border-radius: 9px;
      background: #111; color: #fff; padding: 0 12px; font-size: 14px; outline: none;
    }

    .token-save {
      width: 100%; height: 44px; margin-top: 9px; border: 0; border-radius: 9px;
      background: #555; color: #fff; font-weight: 700; cursor: pointer;
    }

    .hidden { display: none !important; }

    .loading { padding: 30px; text-align: center; color: #d4af37; }

    /* ⭐ v4 : 수동 복사 창 (복사가 막힌 환경용 최후의 보루) */
    .copy-modal-bg {
      position: fixed; left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }

    .copy-modal {
      width: 100%; max-width: 480px;
      background: #222; border: 1px solid #555; border-radius: 16px;
      padding: 18px;
    }

    .copy-modal-title {
      font-size: 15px; font-weight: 800; color: #d4af37; margin-bottom: 10px;
    }

    .copy-modal textarea {
      width: 100%; height: 110px;
      background: #111; color: #fff; border: 1px solid #555;
      border-radius: 10px; padding: 10px;
      font-size: 15px; outline: none; resize: none;
      -webkit-user-select: text; user-select: text;
    }

    .copy-modal-hint {
      margin-top: 8px; font-size: 12px; color: #aaa;
    }

    .copy-modal-close {
      width: 100%; height: 44px; margin-top: 12px;
      border: 0; border-radius: 10px;
      background: #d4af37; color: #111; font-weight: 800; cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">푸로찜 에스</div>
    <div class="subtitle">FENOMENO 김경우님 (납품요청일 기준 택배 어제~내일 표시됨!)</div>
  </div>

  <div id="tokenBox" class="token-box hidden">
    <div class="token-title">🔐 PWA 접속 토큰</div>

    <input id="tokenInput" class="token-input" type="password" placeholder="GAS에서 만든 PWA 토큰">

    <button class="token-save" onclick="saveToken()">
      토큰 저장하고 시작
    </button>
  </div>

  <div id="status" class="status">
    불러오는 중...
  </div>

  <button class="refresh-btn" onclick="loadShippingCards()">
    🔄 새로고침
  </button>

  <div id="cards"></div>

</div>


<script>

  // ==========================================================
  // ⭐ GAS 웹앱 주소
  // ==========================================================

  const GAS_API_URL =
    "https://script.google.com/macros/s/AKfycby5aL9w9txAMetUfCqLytyJDW11_uVTIYj2DNNzpwzMacm-WcDYJ5OrHmRNzbxQESgIKQ/exec";


  // ==========================================================
  // ⭐ 토큰 저장
  // ==========================================================

  function getToken() {
    return localStorage.getItem("PROZYME_PWA_TOKEN") || "";
  }


  function saveToken() {

    const input = document.getElementById("tokenInput");
    const token = input.value.trim();

    if (!token) {
      alert("토큰을 입력해주세요.");
      return;
    }

    localStorage.setItem("PROZYME_PWA_TOKEN", token);

    document.getElementById("tokenBox").classList.add("hidden");

    loadShippingCards();
  }


  // ==========================================================
  // ⭐ 페이지 시작
  // ==========================================================

  window.addEventListener("load", function() {

    const token = getToken();

    if (!token) {

      document.getElementById("tokenBox").classList.remove("hidden");

      document.getElementById("status").textContent =
        "처음 한 번만 PWA 토큰을 입력해주세요.";

      return;
    }

    loadShippingCards();

  });


  // ==========================================================
  // ⭐ 한국 날짜 구하기 (한국 시간 기준)
  //    seoulDate(0) = 오늘,  seoulDate(-1) = 어제,  seoulDate(1) = 내일
  // ==========================================================

  function seoulDate(offsetDays) {

    const d = new Date(Date.now() + (offsetDays || 0) * 86400000);

    return new Intl.DateTimeFormat(
      "en-CA",
      { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }
    ).format(d);   // "yyyy-MM-dd" 모양으로 나옴

  }


  // ==========================================================
  // ⭐ 어떤 모양이든 'yyyy-MM-dd' 로 통일 (PWA 버전)
  // ==========================================================

  function normalizeDatePwa_(value) {

    if (!value) return "";

    let s = String(value).trim();

    if (!s) return "";

    // 이미 yyyy-MM-dd 모양
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      return s.substring(0, 10);
    }

    // '2026. 9. 29.' / '2026/9/29' 모양
    const m = s.match(/(\d{4})[\.\/\-\s]+(\d{1,2})[\.\/\-\s]+(\d{1,2})/);

    if (m) {
      return m[1] + "-" +
             ("0" + m[2]).slice(-2) + "-" +
             ("0" + m[3]).slice(-2);
    }

    return "";

  }


  // ==========================================================
  // ⭐ 택배 데이터 가져오기 (JSONP)
  // ==========================================================

  function loadShippingCards() {

    const token = getToken();

    if (!token) {

      document.getElementById("tokenBox").classList.remove("hidden");

      return;
    }


    document.getElementById("status").textContent =
      "📦 택배 발송 정보를 불러오는 중...";


    document.getElementById("cards").innerHTML =
      '<div class="loading">잠시만 기다려주세요...</div>';


    const callbackName = "prozymePwaCallback_" + Date.now();


    window[callbackName] = function(result) {

      try {

        renderCards(result);

      } finally {

        delete window[callbackName];

        const script = document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      }

    };


    const script = document.createElement("script");

    script.id = callbackName;

    script.src =
      GAS_API_URL
      + "?action=shippingCards"
      + "&key=" + encodeURIComponent(token)
      + "&callback=" + encodeURIComponent(callbackName)
      + "&t=" + Date.now();   // ⭐ 항상 최신 데이터 (캐시 안 씀)


    script.onerror = function() {

      document.getElementById("status").textContent =
        "❌ GAS 연결에 실패했습니다.";

      document.getElementById("cards").innerHTML =
        '<div class="empty">GAS 웹앱 연결을 확인해주세요.</div>';

      delete window[callbackName];

      script.remove();

    };


    document.body.appendChild(script);

  }


  // ==========================================================
  // ⭐ 카드 화면 만들기
  // ==========================================================

  function renderCards(result) {

    if (!result) {
      showError("응답이 없습니다.");
      return;
    }


    if (result.ok === false) {
      showError(result.error || result.message || "데이터를 가져오지 못했습니다.");
      return;
    }


    let rows = [];

    if (Array.isArray(result)) {
      rows = result;
    } else if (Array.isArray(result.cards)) {
      rows = result.cards;
    } else if (Array.isArray(result.rows)) {
      rows = result.rows;
    } else if (Array.isArray(result.data)) {
      rows = result.data;
    }


    // ========================================================
    // ⭐ 이중 안전장치 :
    //     "납품요청일이 어제/오늘/내일" 인 것만 보여준다.
    // ========================================================

    const dYesterday = seoulDate(-1);
    const dToday     = seoulDate(0);
    const dTomorrow  = seoulDate(1);

    rows = rows.filter(function (row) {

      const req = normalizeDatePwa_(row.requestDate);

      // 납품요청일이 없으면 보여주지 않음
      if (!req) {
        return false;
      }

      return (req === dYesterday || req === dToday || req === dTomorrow);

    });


    document.getElementById("status").textContent =
      "📦 납품요청일 기준 택배 " + rows.length + "건 (어제~내일)";


    const container = document.getElementById("cards");

    container.innerHTML = "";


    if (rows.length === 0) {

      container.innerHTML =
        '<div class="empty">'
        + '택배 발송 건이 없습니다.<br><span style="font-size:11px;color:#666">납품요청일이 어제~내일인 택배만 표시됩니다.</span>'
        + '</div>';

      return;
    }


    rows.forEach(function(row, index) {

      container.appendChild(
        createCard(row, index)
      );

    });

  }


  // ==========================================================
  // ⭐ 카드 하나 만들기
  // ==========================================================

  function createCard(row, index) {

    const card = document.createElement("div");
    card.className = "card";


    const client = row.clientName || row.client || row.거래처 || "";
    const phone = row.phone || row.연락처 || row["연락처 1"] || "";
    const search = row.search || row.검색주소 || "";
    const detail = row.detail || row.상세주소 || "";
    const road = row.road || row.도로명주소 || "";
    const jibun = row.jibun || row.지번주소 || "";
    const deliveryType = row.deliveryType || row.납품형태 || "택배 발송";
    const spec = row.spec || row.규격 || row["구분(규격)"] || "";
    const qty = row.qty || row.수량 || "";
    const requestDate = row.requestDate || row.납품요청일 || "";
    const sentDate = row.sentDate || "";


    card.innerHTML = `

      <div class="card-header">

        <div class="client-name">
          ${escapeHtml(client)}
        </div>

        <!-- ⭐ v4.1 추가 : 거래처 이름 복사 버튼 -->
        <button class="copy-btn mini" data-copy="${escapeHtml(client)}">
          복사
        </button>

        <div class="delivery-type">
          ${escapeHtml(deliveryType)}
        </div>

      </div>


      ${makeInfoRow("📞 연락처", phone)}
      ${makeInfoRow("📍 검색주소", search)}
      ${makeInfoRow("🏠 상세주소", detail)}
      ${makeInfoRow("🧭 도로명", road)}
      ${makeInfoRow("📌 지번", jibun)}


      <div class="meta">

        📦 규격 : ${escapeHtml(spec)}
        <br>

        🔢 수량 : ${escapeHtml(qty)}
        <br>

        📅 납품요청일 : ${escapeHtml(requestDate)}
        <br>

        🕐 알람전송일 : ${escapeHtml(sentDate)}

      </div>

    `;


    // ==========================================================
    // ⭐⭐ v4 핵심 수정 :
    //     onclick 인라인 방식(따옴표 사고의 원인)을 없애고,
    //     addEventListener 로 안전하게 복사 기능을 붙인다.
    //     복사할 값은 data-copy 속성에 HTML 이스케이프해서 넣고,
    //     getAttribute 로 꺼내면 원본이 그대로 돌아온다.
    //     (⭐ v4.1 : .copy-btn 을 전부 찾기 때문에
    //       새로 추가된 거래처 복사 버튼도 저절로 여기서 연결됨!)
    // ==========================================================

    const buttons = card.querySelectorAll(".copy-btn");

    buttons.forEach(function (btn) {

      btn.addEventListener("click", function () {

        const text = btn.getAttribute("data-copy") || "";

        copyText(btn, text);

      });

    });


    return card;

  }


  // ==========================================================
  // ⭐ 한 줄 + 복사 버튼
  //    ⭐ v4 핵심 수정 : onclick 인라인 제거!
  //       대신 data-copy 속성에 escapeHtml 한 값을 담아둔다.
  // ==========================================================

  function makeInfoRow(label, value) {

    if (!value) {
      value = "-";
    }


    return `

      <div class="info-row">

        <div class="info-label">
          ${escapeHtml(label)}
        </div>

        <div class="info-value">
          ${escapeHtml(value)}
        </div>

        <button class="copy-btn" data-copy="${escapeHtml(value)}">
          복사
        </button>

      </div>

    `;

  }


  // ==========================================================
  // ⭐⭐ v4 복사 : 3단계 사다리 (거짓 성공 절대 없음!)
  //
  //    1단계 : navigator.clipboard (클릭 순간 바로 시도)
  //    2단계 : 숨은 textarea + select + setSelectionRange + execCommand
  //            (아이폰은 setSelectionRange 없이는 복사 안 됨!)
  //    3단계 : 그래도 실패하면 화면에 텍스트를 보여주고
  //            "탭해서 전체 선택 → 복사" 창을 띄운다.
  //
  //    → "복사됨 ✓" 은 진짜 성공했을 때만 표시한다.
  // ==========================================================

  function copyText(button, text) {

    if (!text || text === "-") {
      flashButton(button, "내용 없음", "복사");
      return;
    }

    // ------------------------------------------------------
    // 1단계 : 최신 클립보드 API (보안 문맥에서만 존재)
    // ------------------------------------------------------
    if (navigator.clipboard && window.isSecureContext) {

      navigator.clipboard.writeText(text).then(function () {

        flashButton(button, "복사됨 ✓", "복사");

      }).catch(function () {

        // 권한이 막힌 환경(인앱 브라우저 등) → 2단계로
        copyByTextarea_(button, text);

      });

      return;
    }

    // ------------------------------------------------------
    // 1단계 사용 불가 환경 → 바로 2단계로
    // ------------------------------------------------------
    copyByTextarea_(button, text);

  }


  // ------------------------------------------------------
  // 2단계 : 구식(하지만 강력한) execCommand 복사
  // ------------------------------------------------------

  function copyByTextarea_(button, text) {

    const textarea = document.createElement("textarea");

    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.top = "-9999px";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    let ok = false;

    try {

      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);   // ⭐ 아이폰 필수!

      ok = document.execCommand("copy");

    } catch (e) {
      ok = false;
    }

    textarea.remove();


    if (ok) {

      flashButton(button, "복사됨 ✓", "복사");

    } else {

      // ------------------------------------------------------
      // 3단계 : 그마저도 실패 → 수동 복사 창 표시
      //         (거짓으로 "복사됨" 표시하지 않는다!)
      // ------------------------------------------------------
      showCopyModal_(text);

    }

  }


  // ------------------------------------------------------
  // 3단계 : 수동 복사 창 (텍스트를 보여주고 탭해서 복사)
  // ------------------------------------------------------

  function showCopyModal_(text) {

    // 이미 열려있으면 닫고 새로 열기
    closeCopyModal_();


    const bg = document.createElement("div");
    bg.className = "copy-modal-bg";
    bg.id = "copyModalBg";

    bg.innerHTML = `
      <div class="copy-modal">

        <div class="copy-modal-title">📋 복사가 막힌 환경이에요</div>

        <textarea readonly id="copyModalText">${escapeHtml(text)}</textarea>

        <div class="copy-modal-hint">
          ☝️ 위 글을 한 번 탭하면 전체 선택돼요.<br>
          "복사"가 뜨면 눌러주세요. (길게 눌러서 선택해도 돼요)
        </div>

        <button class="copy-modal-close" id="copyModalClose">닫기</button>

      </div>
    `;


    document.body.appendChild(bg);


    // 텍스트 영역 탭하면 전체 선택 (선택 후 시스템 복사 메뉴 사용)
    const ta = document.getElementById("copyModalText");

    ta.addEventListener("focus", function () {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
    });

    ta.addEventListener("click", function () {
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
    });


    document.getElementById("copyModalClose").addEventListener("click", closeCopyModal_);

    bg.addEventListener("click", function (e) {
      if (e.target === bg) {
        closeCopyModal_();
      }
    });

  }


  function closeCopyModal_() {

    const bg = document.getElementById("copyModalBg");

    if (bg) {
      bg.remove();
    }

  }


  // ------------------------------------------------------
  // 버튼 표시 바꾸는 도우미
  // ------------------------------------------------------

  function flashButton(button, doneText, originalText) {

    button.textContent = doneText;
    button.classList.add("done");


    setTimeout(function() {

      button.textContent = originalText;
      button.classList.remove("done");

    }, 1200);

  }


  // ==========================================================
  // ⭐ HTML 안전 처리
  // ==========================================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==========================================================
  // ⭐ 오류 표시
  // ==========================================================

  function showError(message) {

    document.getElementById("status").textContent = "❌ 오류";

    document.getElementById("cards").innerHTML =
      '<div class="empty">'
      + escapeHtml(message)
      + '</div>';

  }


  // ==========================================================
  // ⭐ 서비스 워커
  // ==========================================================

  if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

      navigator.serviceWorker.register("sw.js")
        .catch(function(error) {

          console.log("Service Worker 등록 실패:", error);

        });

    });

  }

</script>

</body>
</html>
